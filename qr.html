<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>취향 카드 QR</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Domine:wght@400..700&family=Nunito+Sans:wght@400;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --cream:#F4EEDF; --ink:#201A12; --muted:#5B5346;
    --navy:#14213D; --navy-ink:#F4EEDF;
    --blue:#194AA0; --gold:#C9A24B;
    --card:#FBF8F0; --border:#E3D9C3;
    --bg:var(--cream); --fg:var(--ink);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#17110B; --fg:#F1E9D8; --muted:#B9AE98; --card:#231A10; --border:#3A2E1D; color-scheme: dark; }
  }
  :root[data-theme="dark"]{ --bg:#17110B; --fg:#F1E9D8; --muted:#B9AE98; --card:#231A10; --border:#3A2E1D; color-scheme: dark; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--navy);color:var(--navy-ink);font-family:'Nunito Sans',-apple-system,sans-serif;min-height:100vh}
  .page{max-width:420px;margin:0 auto;padding:56px 24px 48px;text-align:center}
  .logo{width:200px;max-width:70%;height:auto;filter:brightness(0) invert(1);margin:0 0 36px}
  h1{font-family:'Domine',Georgia,serif;font-size:28px;font-weight:700;margin:0 0 10px;line-height:1.3}
  .sub{font-size:15px;color:#B9C2D6;margin:0 0 36px;line-height:1.6}
  .qr-card{
    background:var(--card);
    border-radius:20px;
    padding:28px;
    display:inline-block;
    box-shadow:0 20px 50px rgba(0,0,0,0.25);
  }
  #qr{display:flex;align-items:center;justify-content:center}
  #qr img, #qr canvas{display:block;border-radius:6px}
  .url{
    margin-top:28px;
    font-size:13px;
    color:#B9C2D6;
    word-break:break-all;
    font-family:monospace;
  }
  .hint{
    margin-top:40px;
    font-size:13px;
    color:#8792A8;
    line-height:1.8;
  }
  #downloadBtn{
    margin-top:28px;
    font-family:'Nunito Sans',sans-serif;
    font-size:15px;font-weight:700;
    background:var(--gold);color:var(--ink);
    border:none;border-radius:999px;
    padding:14px 32px;cursor:pointer;
  }
  #downloadBtn:hover{filter:brightness(1.05)}
</style>
</head>
<body>

<div class="page">
  <img class="logo" src="bluecat-wordmark-full.png" alt="Blue Cat — Harukist Muzic Library">
  <h1>칵테일 취향 카드</h1>
  <p class="sub">QR을 스캔하면 바로 취향 카드로 연결됩니다.<br>테이블·코스터·메뉴판에 인쇄해 비치하세요.</p>

  <div class="qr-card">
    <div id="qr"></div>
  </div>

  <p class="url" id="urlText">—</p>

  <button id="downloadBtn">QR 이미지 다운로드</button>

  <p class="hint">이 페이지가 배포된 주소(index.html)를 자동으로 가리키는 QR입니다.</p>
</div>

<script>
(function(){
  // 같은 사이트의 메인 페이지(index.html)를 가리킵니다 — 배포 도메인이 바뀌어도 자동으로 맞습니다.
  var targetUrl = location.origin + location.pathname.replace(/qr\.html$/, "");
  document.getElementById("urlText").textContent = targetUrl;

  new QRCode(document.getElementById("qr"), {
    text: targetUrl,
    width: 280,
    height: 280,
    colorDark: "#14213D",
    colorLight: "#FBF8F0",
    correctLevel: QRCode.CorrectLevel.H
  });

  document.getElementById("downloadBtn").addEventListener("click", function(){
    setTimeout(function(){
      var canvas = document.querySelector("#qr canvas");
      if(!canvas) return;
      var a = document.createElement("a");
      a.href = canvas.toDataURL("image/png");
      a.download = "bluecat-taste-card-qr.png";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }, 50);
  });
})();
</script>
</body>
</html>
