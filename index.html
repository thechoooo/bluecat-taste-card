<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>블루캣 취향 카드</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Domine:wght@400..700&family=Nunito+Sans:wght@400;600;700&display=swap">
<style>
  :root{
    --cream:#F4EEDF; --ink:#201A12; --muted:#5B5346;
    --navy:#14213D; --navy-ink:#F4EEDF; --navy-muted:#B9C2D6;
    --blue:#194AA0; --gold:#C9A24B;
    --card:#FBF8F0; --border:#E3D9C3;
    --card-fg:#201A12; --card-muted:#5B5346;
    --bg:var(--navy); --fg:var(--navy-ink);
    color-scheme: dark;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:'Nunito Sans',-apple-system,sans-serif;line-height:1.7;min-height:100vh}
  .rings{position:absolute;right:-110px;top:-80px;width:360px;height:360px;opacity:0.35}
  .rings circle{fill:none;stroke:var(--gold);stroke-opacity:0.35}
  .page{max-width:460px;margin:0 auto;padding:72px 24px 56px;text-align:center;position:relative}
  .logo-symbol{width:220px;max-width:70%;height:auto;display:block;margin:0 auto 28px;filter:brightness(0) invert(1);opacity:0.95}
  .eyebrow{font-size:13px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin:0 0 16px}
  h1{font-family:'Domine',Georgia,serif;font-size:clamp(28px,7vw,36px);font-weight:700;line-height:1.3;margin:0 0 14px}
  .sub{font-size:16px;color:var(--navy-muted);max-width:380px;margin:0 auto 48px;line-height:1.8}

  .card-link{
    display:block;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:28px;
    margin:0 0 18px;
    text-align:left;
    text-decoration:none;
    color:var(--ink);
    transition:border-color .15s,transform .15s;
  }
  .card-link:hover{border-color:var(--blue);transform:translateY(-2px)}
  .card-eyebrow{font-size:12px;font-weight:700;letter-spacing:2px;color:var(--blue);text-transform:uppercase;margin:0 0 8px}
  .card-title{font-family:'Domine',Georgia,serif;font-size:22px;font-weight:700;margin:0 0 8px}
  .card-desc{font-size:14px;color:var(--muted);margin:0;line-height:1.7}

  footer{padding:40px 24px 48px;text-align:center}
  .logo-wordmark{height:20px;width:auto;opacity:0.7;filter:brightness(0) invert(1)}
</style>
</head>
<body>

<div class="page">
  <svg class="rings" viewBox="0 0 360 360" xmlns="http://www.w3.org/2000/svg">
    <circle cx="180" cy="180" r="170" stroke-width="1"/>
    <circle cx="180" cy="180" r="135" stroke-width="1"/>
    <circle cx="180" cy="180" r="100" stroke-width="1"/>
  </svg>
  <img class="logo-symbol" src="bluecat-wordmark-full.png" alt="Blue Cat — Harukist Muzic Library">
  <p class="eyebrow">Taste DNA</p>
  <h1>오늘, 당신의 취향을 찾아보세요</h1>
  <p class="sub">몇 가지 질문에 답하면 지금 당신에게 어울리는 한 잔이 드러납니다.</p>

  <a class="card-link" href="cocktail.html">
    <p class="card-eyebrow">Cocktail DNA</p>
    <p class="card-title">칵테일 DNA 찾기</p>
    <p class="card-desc">좋아하는 맛과 향, 탄산 취향으로 나만의 칵테일 타입을 찾습니다.</p>
  </a>

  <a class="card-link" href="whiskey.html">
    <p class="card-eyebrow">Whisky DNA</p>
    <p class="card-title">위스키 DNA 찾기</p>
    <p class="card-desc">위스키를 몰라도 괜찮습니다. 음료와 커피, 향으로 첫 한 병을 찾습니다.</p>
  </a>
</div>

<footer>
  <img class="logo-wordmark" src="bluecat-wordmark.png" alt="Blue Cat">
</footer>

</body>
</html>
